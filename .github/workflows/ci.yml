---
name: CI

"on":
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip

      - name: Install pre-commit and ansible-lint
        run: pip install pre-commit ansible-lint

      - name: Install required Ansible collections
        run: ansible-galaxy collection install community.docker

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-

      - name: Run pre-commit
        run: pre-commit run --all-files

  molecule:
    name: "Molecule / ${{ matrix.distro }}"
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        distro:
          - ubuntu2204 # jammy
          - ubuntu2404 # noble
          - debian11 # bullseye
          - debian12 # bookworm
          - debian13 # trixie
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip

      - name: Install molecule and dependencies
        run: pip install ansible-core molecule "molecule-plugins[docker]" docker

      - name: Create role symlink for Ansible
        run: |
          mkdir -p "$HOME/.ansible/roles"
          ln -sf "$GITHUB_WORKSPACE" "$HOME/.ansible/roles/realtime.traefik"

      - name: Run molecule test
        run: molecule test
        env:
          MOLECULE_DISTRO: ${{ matrix.distro }}
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"

  galaxy:
    name: Galaxy import
    runs-on: ubuntu-latest
    needs: molecule
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - name: Trigger Ansible Galaxy import
        uses: ansible/galaxy-action@v1
        with:
          galaxy_api_key: ${{ secrets.GALAXY_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

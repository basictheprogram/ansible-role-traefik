---
# Internal constants — not part of the public interface.

# Library middlewares rendered into dynamic/middlewares.yml.
# Keys are middleware names; values are the Traefik middleware config dict.
traefik_builtin_middlewares:
  security-headers:
    headers:
      stsSeconds: 63072000        # 2 years
      stsIncludeSubdomains: true
      stsPreload: false
      frameDeny: true
      contentTypeNosniff: true
      referrerPolicy: same-origin
  compress:
    compress: {}

# Applied to every site router, in order, before per-site extra_middlewares.
traefik_default_middlewares:
  - security-headers

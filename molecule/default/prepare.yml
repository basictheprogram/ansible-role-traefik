---
# Install Docker CLI and Compose v2 plugin on the molecule test instance.
# The Docker daemon is not installed — the socket is bind-mounted from the
# host (Docker Desktop), so only the CLI tooling is needed.
#
# Ubuntu: docker-compose-v2 is in the default Ubuntu repos.
# Debian: docker-compose-plugin requires Docker's official apt repo.
#         Uses deb822_repository (modern .sources format), which works on
#         both Debian 12 (bookworm) and Debian 13 (trixie). Trixie is mapped
#         to the bookworm Docker repo as Docker has not published a trixie
#         release yet. apt_repository is not used because apt-key was removed
#         in Debian 13.
- name: Prepare
  hosts: all
  gather_facts: true
  become: true
  tasks:
    - name: Prepare | install Docker CLI and Compose plugin (Ubuntu)
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
          - python3-docker
        state: present
        update_cache: true
      when: ansible_facts["distribution"] == "Ubuntu"

    - name: Prepare | install prerequisites (Debian)
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true
      when: ansible_facts["distribution"] == "Debian"

    - name: Prepare | add Docker apt repository (Debian)
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: "https://download.docker.com/linux/debian"
        suites: >-
          {{ 'bookworm' if ansible_facts['distribution_release'] == 'trixie'
             else ansible_facts['distribution_release'] }}
        components: stable
        architectures: >-
          {{ ansible_facts['architecture']
             | replace('x86_64', 'amd64')
             | replace('aarch64', 'arm64') }}
        signed_by: "https://download.docker.com/linux/debian/gpg"
        install_python_debian: true
        state: present
      when: ansible_facts["distribution"] == "Debian"

    - name: Prepare | install Docker CE CLI and Compose plugin (Debian)
      ansible.builtin.apt:
        name:
          - docker-ce-cli
          - docker-compose-plugin
          - python3-docker
        state: present
        update_cache: true
      when: ansible_facts["distribution"] == "Debian"

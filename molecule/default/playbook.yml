---
- name: Converge
  hosts: all
  vars:
    # Disable ACME so molecule runs without DNS provider credentials.
    traefik_acme_enabled: false

    traefik_wildcard_certs:
      - name: test-cert
        resolver: ionos          # resolver name; unused when ACME disabled
        main: "*.example.test"
        sans: []

    traefik_default_cert: test-cert

    traefik_sites:
      - name: app
        fqdns:
          - app.example.test
        backend: http://127.0.0.1:8080

    traefik_allowlist_groups: {}

  roles:
    - role: realtime.traefik

---
- name: Converge
  hosts: all
  pre_tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        force_apt_get: true
      changed_when: false
      when: ansible_facts.os_family == 'Debian'

    - name: Update dnf cache
      ansible.builtin.dnf:
        update_cache: true
      changed_when: false
      when: ansible_facts.os_family == 'RedHat'

  vars:
    # ACME enabled so every resolver challenge type is rendered into
    # traefik.yml. Traefik is never started in molecule (the compose tasks
    # are tagged molecule-notest), so nothing contacts a CA or DNS provider;
    # the credentials below are intentionally fake test values.
    traefik_acme_enabled: true
    traefik_acme_email: "molecule@example.test"

    # journald is unavailable on Docker Desktop; use json-file for molecule.
    traefik_compose_log_driver: json-file

    # Static tag so every platform renders an identical compose.yml and
    # produces the same config-hash. Without this, inventory_hostname
    # differences cause compose to recreate the container on each platform,
    # resulting in a name conflict on the shared Docker Desktop daemon.
    traefik_journald_tag: "traefik.molecule"

    # Skip healthcheck in molecule — the verify step is a production concern
    # and depends on Traefik having real network access and port bindings.
    traefik_verify_healthcheck: false

    traefik_acme_resolvers:
      route53:
        provider: route53
        delay_before_check: 0
        env:
          AWS_ACCESS_KEY_ID: "AKIAIOSFODNN7EXAMPLE"
          AWS_SECRET_ACCESS_KEY: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
          AWS_REGION: us-east-1
      http01:
        challenge: http
      tlsalpn01:
        challenge: tls-alpn

    traefik_wildcard_certs:
      - name: test-cert
        resolver: route53
        main: "*.example.test"
        sans:
          - "www.example.test"
      # Non-dns challenges issue exact FQDNs only (no wildcards).
      - name: http-cert
        resolver: http01
        main: "http.example.test"
      - name: alpn-cert
        resolver: tlsalpn01
        main: "alpn.example.test"

    traefik_default_cert: test-cert

    traefik_allowlist_groups:
      office:
        - "203.0.113.0/24"    # TEST-NET-3, RFC 5737 — documentation use only
      staff:
        - "198.51.100.1/32"   # TEST-NET-2, RFC 5737 — documentation use only

    traefik_sites:
      - name: app
        fqdns:
          - app.example.test
        backend: http://127.0.0.1:8080
        allowlist:
          - office
          - staff

      - name: open-app
        fqdns:
          - open.example.test
        backend: http://127.0.0.1:9090

      - name: http-app
        fqdns:
          - http.example.test
        backend: http://127.0.0.1:9091
        cert: http-cert

      - name: alpn-app
        fqdns:
          - alpn.example.test
        backend: http://127.0.0.1:9092
        cert: alpn-cert

  roles:
    - role: realtime.traefik

# Negative preflight cases: each block runs only the role's preflight tasks
# with one invalid setting and asserts it fails with the expected message.
- name: Converge | preflight rejects invalid ACME resolver settings
  hosts: all
  gather_facts: true
  vars:
    _base_resolvers:
      rfc2136:
        provider: rfc2136
        delay_before_check: 0
        env:
          RFC2136_TSIG_API_KEY: "fake-test-key"
      http01:
        challenge: http
    _preflight_cases:
      - name: wildcard on an http resolver
        expect: "cannot issue wildcard certs"
        vars:
          traefik_wildcard_certs:
            - { name: bad, resolver: http01, main: "*.example.test" }
      - name: wildcard san on an http resolver
        expect: "cannot issue wildcard certs"
        vars:
          traefik_wildcard_certs:
            - { name: bad, resolver: http01, main: "example.test", sans: ["*.example.test"] }
      - name: default cert on an http resolver
        expect: "must use a dns resolver"
        vars:
          traefik_wildcard_certs:
            - { name: bad, resolver: http01, main: "example.test" }
          traefik_default_cert: bad
      - name: unknown challenge value
        expect: "must be one of dns, http, tls-alpn"
        vars:
          traefik_acme_resolvers:
            bogus: { challenge: bogus }
      - name: dns resolver without provider
        expect: "must set provider"
        vars:
          traefik_acme_resolvers:
            noprovider: { delay_before_check: 0, env: {} }
  tasks:
    - name: Preflight case | {{ item.name }}
      ansible.builtin.include_tasks: tasks/preflight_case.yml
      loop: "{{ _preflight_cases }}"
      loop_control:
        label: "{{ item.name }}"

---
# Remove resources created on the host Docker daemon by the role during
# testing. These are outside molecule's own container lifecycle and are
# not removed by the destroy playbook automatically.
#
# Targets localhost (the host running Docker) rather than the molecule
# test instances — molecule test calls cleanup before create, so the
# instance inventory is empty on the first pass. localhost is always
# present and has access to the Docker daemon via the socket.
#
# Errors are suppressed — resources may not exist if converge failed
# early or this is the first run on a clean machine.
- name: Cleanup
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Cleanup | remove Traefik container from host daemon
      ansible.builtin.command:
        cmd: docker rm -f traefik
      changed_when: false
      failed_when: false

    - name: Cleanup | remove traefik_proxy network from host daemon
      ansible.builtin.command:
        cmd: docker network rm traefik_proxy
      changed_when: false
      failed_when: false

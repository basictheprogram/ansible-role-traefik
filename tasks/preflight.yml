---
- name: Preflight | traefik_wildcard_certs was renamed to traefik_certs
  ansible.builtin.assert:
    that:
      - traefik_wildcard_certs is not defined
    fail_msg: |-
      The variable traefik_wildcard_certs was renamed to traefik_certs, and
      this role no longer reads the old name.

      What happened: this role now issues certificates with HTTP-01 and
      TLS-ALPN-01 as well as DNS-01. Those certificates are exact FQDNs, not
      wildcards, so the old name was misleading and was replaced.

      Your inventory still sets traefik_wildcard_certs, so it is being
      ignored. Continuing would fail later with misleading "FQDNs not
      covered by any cert" errors, or deploy Traefik with no certificates.

      How to fix: rename the variable to traefik_certs wherever you set it
      (host_vars, group_vars, or playbook vars). The list contents are
      unchanged and no other edits are needed. For example, change
      "traefik_wildcard_certs:" to "traefik_certs:".
    quiet: true

- name: Preflight | ansible-core version meets minimum
  ansible.builtin.assert:
    that:
      - ansible_version.full is version('2.20', '>=')
    fail_msg: "realtime.traefik requires ansible-core >= 2.20 (found {{ ansible_version.full }})"
    quiet: true

- name: Preflight | traefik_sites is a list
  ansible.builtin.assert:
    that:
      - traefik_sites | type_debug == 'list'
    fail_msg: "traefik_sites must be a list (can be empty when using only co-located containers)"
    quiet: true

- name: Preflight | traefik_acme_email required when ACME enabled
  ansible.builtin.assert:
    that:
      - traefik_acme_email | length > 0
    fail_msg: "traefik_acme_email must be set when traefik_acme_enabled is true"
    quiet: true
  when: traefik_acme_enabled

- name: Preflight | every resolver challenge is dns, http, or tls-alpn
  ansible.builtin.assert:
    that:
      - item.value.challenge | default('dns') in ['dns', 'http', 'tls-alpn']
    fail_msg: >-
      resolver '{{ item.key }}' has challenge '{{ item.value.challenge | default('dns') }}';
      it must be one of dns, http, tls-alpn
    quiet: true
  loop: "{{ traefik_acme_resolvers | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: traefik_acme_enabled

- name: Preflight | every dns resolver sets a provider
  ansible.builtin.assert:
    that:
      - item.value.provider is defined
      - item.value.provider | length > 0
    fail_msg: "dns resolver '{{ item.key }}' must set provider"
    quiet: true
  loop: "{{ traefik_acme_resolvers | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - traefik_acme_enabled
    - item.value.challenge | default('dns') == 'dns'

- name: Preflight | every cert resolver is defined in traefik_acme_resolvers
  ansible.builtin.assert:
    that:
      - item.resolver in traefik_acme_resolvers
    fail_msg: >-
      cert '{{ item.name }}' references resolver '{{ item.resolver }}'
      which is not defined in traefik_acme_resolvers
    quiet: true
  loop: "{{ traefik_certs }}"
  loop_control:
    label: "{{ item.name }}"
  when: traefik_acme_enabled

- name: Preflight | http and tls-alpn certs have no wildcard names
  ansible.builtin.assert:
    that:
      - ([item.main] + (item.sans | default([]))) | select('match', '^[*][.]') | list | length == 0
    fail_msg: >-
      cert '{{ item.name }}' uses resolver '{{ item.resolver }}'
      ({{ traefik_acme_resolvers[item.resolver].challenge }}), which cannot issue
      wildcard certs; use a dns resolver or list exact FQDNs
    quiet: true
  loop: "{{ traefik_certs }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - traefik_acme_enabled
    - traefik_acme_resolvers[item.resolver].challenge | default('dns') != 'dns'

- name: Preflight | traefik_default_cert names a real cert
  ansible.builtin.assert:
    that:
      - traefik_certs | selectattr('name', 'equalto', traefik_default_cert) | list | length > 0
    fail_msg: >-
      traefik_default_cert '{{ traefik_default_cert }}' does not match
      any entry in traefik_certs
    quiet: true
  when: traefik_default_cert | length > 0

- name: Preflight | traefik_default_cert uses a dns resolver
  ansible.builtin.assert:
    that:
      - >-
        traefik_acme_resolvers[
          (traefik_certs | selectattr('name', 'equalto', traefik_default_cert) | first).resolver
        ].challenge | default('dns') == 'dns'
    fail_msg: >-
      traefik_default_cert '{{ traefik_default_cert }}' is bound to a non-dns
      resolver; the default store cert must use a dns resolver
    quiet: true
  when:
    - traefik_acme_enabled
    - traefik_default_cert | length > 0

- name: Preflight | explicit site.cert exists in traefik_certs
  ansible.builtin.assert:
    that:
      - traefik_certs | selectattr('name', 'equalto', item.cert) | list | length > 0
    fail_msg: >-
      site '{{ item.name }}' specifies cert '{{ item.cert }}'
      which is not in traefik_certs
    quiet: true
  loop: "{{ traefik_sites | selectattr('cert', 'defined') | selectattr('cert', 'ne', '') | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Preflight | collect resolver credentials for active certs
  ansible.builtin.set_fact:
    _traefik_cred_items: >-
      {{
        traefik_certs
        | map(attribute='resolver')
        | unique
        | map('extract', traefik_acme_resolvers)
        | map(attribute='env', default={})
        | map('dict2items')
        | flatten
      }}
  no_log: true
  when: traefik_acme_enabled

- name: Preflight | resolver credentials are non-empty
  ansible.builtin.assert:
    that:
      - item.value | length > 0
    fail_msg: "credential '{{ item.key }}' is empty; set and vault the variable before running"
    quiet: true
  loop: "{{ _traefik_cred_items | default([]) }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true
  when: traefik_acme_enabled

- name: Preflight | compute FQDNs without cert coverage
  ansible.builtin.set_fact:
    _traefik_uncovered_fqdns: >-
      {%- set ns = namespace(uncovered=[]) -%}
      {%- for site in traefik_sites -%}
      {%- for fqdn in site.fqdns -%}
      {%- set found = namespace(ok=false) -%}
      {%- for cert in traefik_certs -%}
      {%- for pat in ([cert.main] + (cert.sans | default([]))) -%}
      {%- if not found.ok -%}
      {%- if pat == fqdn or (
            pat.startswith('*.') and fqdn.endswith(pat[1:]) and
            (fqdn.split('.') | length) == (pat.split('.') | length)
          ) -%}
      {%- set found.ok = true -%}
      {%- endif -%}
      {%- endif -%}
      {%- endfor -%}
      {%- endfor -%}
      {%- if not found.ok -%}
      {%- set ns.uncovered = ns.uncovered + [fqdn] -%}
      {%- endif -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ ns.uncovered | to_json }}

- name: Preflight | all site FQDNs covered by a cert
  ansible.builtin.assert:
    that:
      - _traefik_uncovered_fqdns | from_json | length == 0
    fail_msg: >-
      FQDNs not covered by any cert in traefik_certs:
      {{ _traefik_uncovered_fqdns | from_json | join(', ') }}
    quiet: true

- name: Preflight | Docker socket exists
  ansible.builtin.stat:
    path: /var/run/docker.sock
  register: _traefik_docker_sock

- name: Preflight | Docker socket is reachable
  ansible.builtin.assert:
    that:
      - _traefik_docker_sock.stat.exists
      - _traefik_docker_sock.stat.issock
    fail_msg: "/var/run/docker.sock not found or not a socket; ensure Docker Engine is installed and running"
    quiet: true
  tags: molecule-notest

---
dependencies: []

galaxy_info:
  namespace: realtime
  role_name: traefik
  author: "Bob Tanner"
  company: "Real Time Enterprises, Inc."
  issue_tracker_url: "https://github.com/basictheprogram/ansible-role-traefik/issues"
  description: >-
    Deploys Traefik v3 as a reverse proxy and TLS edge on a single Docker host.
    Manages DNS-01 ACME certificate issuance via RFC 2136 dynamic DNS updates
    (compatible with BIND9, Knot, PowerDNS, and any TSIG-capable nameserver),
    wildcard certificates, and dynamic routing configuration through the Traefik
    file provider. Originally authored by Matthias Leutenegger; modernized for
    ansible-core 2.20, Traefik v3, and an RFC 2136 DNS-01 ACME strategy by
    Bob Tanner at Real Time Enterprises, Inc.
  license: "MIT"
  min_ansible_version: "2.20"
  platforms:
    - name: Ubuntu
      versions:
        - jammy    # 22.04 LTS, standard support until April 2027
        - noble    # 24.04 LTS, standard support until April 2029
        - resolute # 26.04 LTS, standard support until April 2031
    - name: Debian
      versions:
        - bookworm # 12, current stable
        - trixie   # 13, next stable
  galaxy_tags:
    - traefik
    - reverseproxy
    - proxy
    - docker
    - acme
    - dns01
    - tls
    - letsencrypt
    - ubuntu
    - debian
